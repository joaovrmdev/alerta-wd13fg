name: Caçador de preço bugado

# Quem dispara de verdade é o cron-job.org (a cada 10 minutos, chamando a API do GitHub).
# O agendamento abaixo é só reserva: o GitHub costuma atrasar ou pular esses horários.
on:
  schedule:
    - cron: "3,33 * * * *"
  pull_request:            # nos pull requests só simula (não manda mensagem)
  workflow_dispatch:
    inputs:
      modo:
        description: "verificar = rodada normal | teste = manda a análise do melhor candidato agora"
        type: choice
        options: [verificar, teste]
        default: verificar

permissions:
  contents: read

concurrency:
  group: cacador
  cancel-in-progress: false

jobs:
  cacador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODO: ${{ github.event_name == 'pull_request' && 'simulacao' || inputs.modo || 'verificar' }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEPURAR: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recupera as ofertas já vistas
        uses: actions/cache/restore@v4
        with:
          path: estado-cacador
          key: cacador-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cacador-

      - name: Procura preço bugado
        run: python cacador.py "$MODO"

      - name: Guarda as ofertas já vistas
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: estado-cacador
          key: cacador-${{ github.run_id }}-${{ github.run_attempt }}
