name: Sonda temporária (simulação do alerta)
on:
  push:
    branches: [cacador-dev]
permissions:
  contents: read
jobs:
  simula:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPURAR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          for cfg in config-azzaro-wanted.json config.json; do
            echo "::group::$cfg"
            CONFIG="$cfg" python alerta.py simulacao || echo "FALHOU $cfg"
            echo "::endgroup::"
          done
