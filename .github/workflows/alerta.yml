name: Alerta WD13FG

on:
  # Quem dispara de verdade é o cron-job.org (a cada 30 minutos, chamando a API do GitHub).
  # O agendamento abaixo é só reserva: o GitHub costuma atrasar ou pular esses horários.
  schedule:
    - cron: "7,27,47 * * * *"
  pull_request:            # nos pull requests só simula (não manda mensagem)
  workflow_dispatch:
    inputs:
      modo:
        description: "teste = manda mensagem agora | verificar = só avisa se estiver em promoção"
        type: choice
        options: [teste, verificar]
        default: teste

permissions:
  contents: read

concurrency:
  group: alerta-wd13fg
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODO: ${{ github.event_name == 'pull_request' && 'simulacao' || inputs.modo || 'verificar' }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_ID_CACADOR: ${{ secrets.TELEGRAM_CHAT_ID_CACADOR }}  # grupo: só produtos com "no_grupo"
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
      DEPURAR: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recupera o histórico de preços
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: estado-

      # um produto por arquivo: config.json (lava e seca) e cada config-*.json.
      # Se um produto der erro, os outros continuam; no fim o passo falha para aparecer no Actions.
      - name: Verifica os preços de cada produto
        run: |
          falhou=0
          for cfg in config.json config-*.json; do
            echo "::group::$cfg"
            CONFIG="$cfg" python alerta.py "$MODO" || { echo "::error::$cfg falhou"; falhou=1; }
            echo "::endgroup::"
          done
          exit $falhou

      - name: Guarda o histórico de preços
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}-${{ github.run_attempt }}
