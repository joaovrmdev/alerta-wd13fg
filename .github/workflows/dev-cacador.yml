name: Teste temporário do caçador
on:
  push:
    branches: [cacador-dev]
permissions:
  contents: read
jobs:
  simula:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: DEPURAR=1 python cacador.py simulacao
